    intrinsic_yaw_offset_deg: 0     # TODO calibrate
    clusters: [vehicle, cut_in]

  vehicle_truck:
    ply_path: /workspace/CoachDrive/external/asset-harvester/outputs/harvesting/consumer_vehicles/f32727777c346318/gaussians.ply
    scale_m: 5.76
    intrinsic_yaw_offset_deg: 0     # TODO calibrate
    clusters: [vehicle, cut_in, special_vehicle]


# ── Cluster → eligible asset pool ─────────────────────────────────────────
# Used by the scenario generator (TODO) to pick assets per cluster name.
# Asset selection within a cluster is uniform random by default.
clusters:
  ego_lane_blocking:    [ped_back_red, ped_small]
  ego_lane_swerve:      [ped_back_red, ped_small]
  carpark_edge:         [ped_back_red, ped_small]
  pedestrian:           [ped_back_red, ped_small, ped_neutral]
  erratic_pedestrian:   [ped_zombie_a, ped_zombie_b, ped_soldier, ped_mascot_duck, ped_mascot_bear]
  animal:               [wolf, bear, lion, elephant]
  construction:         [cone, dumpster]
  debris:               [cone, dumpster, wrecked_sedan, burnt_truck]
  special_vehicle:      [vehicle_truck, burnt_truck, wrecked_sedan]
  cut_in:               [vehicle_sedan_a, vehicle_sedan_b, vehicle_truck]
  child_substitute:     [ped_small]
