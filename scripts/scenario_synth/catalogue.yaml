# Asset catalogue for scenario synthesis.
#
# Each entry under `assets` is one calibrated PLY that the compositor can
# consume. Keys:
#   ply_path:                 absolute path to gaussians.ply
#   scale_m:                  uniform scale (= max real-world dimension in meters,
#                             since asset-harvester normalizes the PLY so the
#                             longest object dim ≈ 1 in PLY coords)
#   intrinsic_yaw_offset_deg: rotation around the asset's local Y-up axis to
#                             apply BEFORE ego-frame yaw, so that face_ego yaw
#                             actually puts the asset's "front" toward ego.
#                             Calibrated by inspecting yaw_grid renders.
#   clusters:                 which scenario-cluster pools this asset can serve.
#
# The `clusters` map at the bottom is the inverse view: pick a cluster,
# get the eligible asset names. Used by dump_scenario_spec.py once it
# learns to read this file (TODO).

assets:
  # ── Pedestrians (rectified_AV_objects, NCore-format inference) ─────────
  ped_back_red:
    ply_path: /workspace/CoachDrive/external/asset-harvester/outputs/harvesting/VRU_pedestrians/723ce847bf6b1671/gaussians.ply
    scale_m: 1.911
    intrinsic_yaw_offset_deg: 180   # natural capture is back-toward-camera
    clusters: [pedestrian, ego_lane_blocking, ego_lane_swerve, carpark_edge]
    notes: "Adult, red plaid jacket + backpack. Original PoC asset."

  ped_small:
    ply_path: /workspace/CoachDrive/external/asset-harvester/outputs/harvesting/VRU_pedestrians/0d7b602f2da8c364/gaussians.ply
    scale_m: 1.72
    intrinsic_yaw_offset_deg: 0     # naturally faces camera
    clusters: [pedestrian, ego_lane_blocking, ego_lane_swerve, child_substitute]
    notes: "Smallest pedestrian (1.72 m). Standin for child class until we generate one."

  ped_neutral:
    ply_path: /workspace/CoachDrive/external/asset-harvester/outputs/harvesting/VRU_pedestrians/c2d728e02d4d11cc/gaussians.ply
    scale_m: 1.74
    intrinsic_yaw_offset_deg: 0     # TODO calibrate
    clusters: [pedestrian]
    notes: "Third pedestrian — yaw not formally calibrated, default 0."

  # ── Erratic / unusual humanoids (OOD inference) ────────────────────────
  ped_zombie_a:
    ply_path: /workspace/CoachDrive/external/asset-harvester/outputs/harvesting_ood/589ea10f5ec8eb9f/gaussians.ply
    scale_m: 1.85
    intrinsic_yaw_offset_deg: 0     # TODO calibrate
    clusters: [erratic_pedestrian]
    notes: "Realistic zombie. Useful for unusual-pedestrian cluster."

  ped_zombie_b:
    ply_path: /workspace/CoachDrive/external/asset-harvester/outputs/harvesting_ood/71b0c1b1bfc1a32f/gaussians.ply
    scale_m: 1.80
    intrinsic_yaw_offset_deg: 0     # TODO calibrate
    clusters: [erratic_pedestrian]

  ped_soldier:
    ply_path: /workspace/CoachDrive/external/asset-harvester/outputs/harvesting_ood/bade95406ca586d1/gaussians.ply
    scale_m: 1.95
    intrinsic_yaw_offset_deg: 0     # TODO calibrate
    clusters: [erratic_pedestrian, special_pedestrian]
    notes: "Gorilla in cargo pants — quirky chimera, useful for OOD ped variation."

  ped_mascot_duck:
    ply_path: /workspace/CoachDrive/external/asset-harvester/outputs/harvesting_ood/049d71efa8dc0eed/gaussians.ply
    scale_m: 1.80
    intrinsic_yaw_offset_deg: 0     # calibrated — beak/face toward camera at 0
    clusters: [erratic_pedestrian]

  ped_mascot_bear:
