    scale_m: 1.5     # body length
    intrinsic_yaw_offset_deg: 0
    clusters: [animal]
    notes: "Wolf, side view in PLY → good for road-crossing pose."

  bear:
    ply_path: /workspace/CoachDrive/external/asset-harvester/outputs/harvesting_ood/a2b649d50b7d940d/gaussians.ply
